name: Feature request
description: Suggest a new feature or an improvement to PrepDeck.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PrepDeck!

        A good feature request explains the problem or use case first, then describes a possible solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: |
        What problem would this feature solve?
        Please describe the user need or limitation rather than only the desired implementation.
      placeholder: |
        As a PrepDeck user, I want to ...
        Currently, ...
        This makes it difficult to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you think the feature could work.
      placeholder: |
        I would like PrepDeck to ...
    validations:
      required: true

  - type: textarea
    id: user_flow
    attributes:
      label: Expected user experience
      description: |
        If applicable, describe the expected workflow from the user's perspective.
      placeholder: |
        1. The user ...
        2. PrepDeck ...
        3. The user can ...

  - type: dropdown
    id: area
    attributes:
      label: Related area
      description: Which part of PrepDeck would this feature affect?
      multiple: true
      options:
        - Web UI
        - Authentication
        - Question Bank
        - Practice / Quiz
        - Bookmarks
        - Wrong Questions
        - Knowledge Points
        - Admin
        - AI features
        - MCP
        - API / Backend
        - Database
        - Documentation
        - Deployment / Infrastructure
        - Other

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: |
        If you already have concrete requirements, describe the conditions that would make this feature complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you considered any alternative solutions or workarounds?

  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: |
        Add screenshots, mockups, links, examples from other applications, or related issues if useful.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help us understand the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find an issue covering the same request.
          required: true
        - label: This request describes a concrete problem or use case.
          required: true
