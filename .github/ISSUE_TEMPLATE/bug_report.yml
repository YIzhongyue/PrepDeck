name: Bug report
description: Report a reproducible problem or unexpected behavior in PrepDeck.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in PrepDeck!

        Before submitting, please check existing issues to make sure the problem has not already been reported.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem you encountered.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the minimum steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: |
        If applicable, add screenshots, screen recordings, logs, or other material that helps explain the problem.
      placeholder: Drag and drop files here.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of PrepDeck is affected?
      multiple: true
      options:
        - Web UI
        - Authentication
        - Question Bank
        - Practice / Quiz
        - Bookmarks
        - Wrong Questions
        - Knowledge Points
        - Admin
        - AI features
        - MCP
        - API / Backend
        - Database
        - Documentation
        - Deployment / Infrastructure
        - Other

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide any environment information relevant to the issue.
      placeholder: |
        - Deployment: Hosted / Local development
        - OS: Windows 11 / macOS / Linux
        - Browser: Chrome 153
        - PrepDeck version or commit: ...
        - Other relevant details: ...

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: |
        Paste relevant logs, stack traces, browser console errors, or server errors.

        Please remove API keys, access tokens, passwords, personal data, or other secrets before submitting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help us understand or reproduce the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find an existing report for this problem.
          required: true
        - label: I have removed sensitive information such as API keys, tokens, passwords, and personal data.
          required: true
