name: Local development and export safety

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tracked source for credentials before export
        run: npm run oss:check
      - name: Verify configuration, export sanitization and isolated history
        run: npm run test:local
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise clean local bootstrap, bindings and browser login
        timeout-minutes: 10
        run: npm run test:local:smoke -- --browser
