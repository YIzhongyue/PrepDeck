name: CI

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test workspaces
        run: npm test --workspaces --if-present

      - name: Type-check workspaces
        run: npm run typecheck

      # Do not use the root build command here:
      # the Worker build hook applies remote D1 migrations when CI=true.
      # Deployment and migrations belong in a separate,
      # explicitly authorized workflow.
      - name: Build web application
        run: npm run build --workspace apps/web

  browser:
    # `npm test` globs *.test.mjs, so the *.browser.mjs regressions ran nowhere
    # automatically and drifted unnoticed: one had been driving a textarea the
    # editor replaced with a contenteditable, another asserted against whichever
    # page happened to be rendered, and a third had a genuine product failure
    # nobody saw. A failing assertion nothing executes is not a regression test.
    #
    # Split into shards (issue #83): one failing script used to stop the `&&`
    # chain, hiding every script after it, and a rerun meant the whole suite.
    # scripts/browser-regressions.mjs runs every script of its shard, reports
    # each failure, and keeps a failing script's screenshots, DOM and
    # console/request log. It never retries; a flaky script has to be fixed.
    name: Browser regressions (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The runner's own failure paths: a failing or timed-out script must
      # leave its page behind. One shard is enough; they do not depend on it.
      - name: Test the browser regression runner
        if: matrix.shard == 1
        run: npm run test:browser:runner

      - name: Install WebKit for phone reading regressions
        if: matrix.shard == 1
        run: npx playwright install --with-deps webkit

      - name: Check phone reading in WebKit
        if: matrix.shard == 1
        run: npm run test:browser -- question-card-layout
        env:
          PLAYWRIGHT_BROWSER: webkit
          BROWSER_DIAGNOSTICS_ROOT: ${{ runner.temp }}/browser-diagnostics-webkit

      - name: Run browser regressions
        run: npm run test:browser -- --shard ${{ matrix.shard }}/3
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/browser-screenshots
          KP_SCREENSHOTS: ${{ runner.temp }}/browser-screenshots
          BROWSER_DIAGNOSTICS_ROOT: ${{ runner.temp }}/browser-diagnostics

      - name: Save browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-diagnostics
            ${{ runner.temp }}/browser-diagnostics-webkit
          if-no-files-found: ignore
          retention-days: 14

  python:
    # Split out from `validate` so the interpreter matrix costs three Python
    # runs, not three copies of the Node build. The matrix itself is the point:
    # `scripts/validate_quiz.py` has to agree with the Worker's TypeScript
    # validator on every version the Skill claims to support, and a single
    # pinned interpreter only ever proved the contract against that release's
    # own parsing behaviour — which is how a timestamp the Worker rejects came
    # to pass offline validation on a newer Python.
    name: Skill and import contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for PDF evidence checks
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PDF test dependencies
        run: python -m pip install 'pymupdf>=1.24,<2' 'jsonschema>=4,<5' 'PyYAML>=6,<7'

      - name: Test Skill validation and packages
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*skills.py'
          bash .github/scripts/package-skills.sh

      - name: Test PDF conversion and import contract
        run: npm run test:pdf2json
